<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAET Advanced Tracking Tool — AEA</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CSS VARIABLES & RESET
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root {
  --navy: #003366;
  --navy-dark: #001a33;
  --navy-light: #004080;
  --gold: #C5960C;
  --gold-light: #f5e6b8;
  --gold-pale: #faf3e0;
  --bg: #f0f2f5;
  --card: #ffffff;
  --text: #1a1a2e;
  --text-muted: #6b7280;
  --green: #16a34a;
  --green-light: #dcfce7;
  --blue: #2563eb;
  --blue-light: #dbeafe;
  --orange: #ea580c;
  --orange-light: #ffedd5;
  --red: #dc2626;
  --red-light: #fee2e2;
  --border: #e2e5ea;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
  --shadow-lg: 0 4px 12px rgba(0,0,0,0.08), 0 8px 24px rgba(0,0,0,0.04);
  --radius: 10px;
  --radius-lg: 14px;
  --font-display: 'Outfit', sans-serif;
  --font-body: 'DM Sans', sans-serif;
}
html { scroll-behavior: smooth }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--navy); text-decoration: none }
button { font-family: var(--font-body); cursor: pointer }
h1,h2,h3,h4,h5 { font-family: var(--font-display); line-height: 1.3 }

/* ============================================================
   HEADER
   ============================================================ */
.header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
  color: #fff;
  padding: 0;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0.7rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header-brand { display: flex; align-items: center; gap: 0.75rem; cursor: pointer }
.header-logo {
  width: 40px; height: 40px;
  background: var(--gold);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display);
  font-weight: 900; font-size: 0.85rem;
  color: var(--navy-dark);
  letter-spacing: -0.5px;
}
.header-text .header-title { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; letter-spacing: 0.3px }
.header-text .header-sub { font-size: 0.7rem; opacity: 0.7; font-weight: 400 }
.header-actions { display: flex; align-items: center; gap: 1rem }
.header-user { font-size: 0.85rem; opacity: 0.85 }
.btn-reset {
  background: rgba(255,255,255,0.1);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.2);
  padding: 0.35rem 0.85rem;
  border-radius: 6px;
  font-size: 0.78rem;
  font-weight: 600;
  transition: all 0.2s;
}
.btn-reset:hover { background: rgba(255,255,255,0.2) }
.btn-back {
  background: none; border: none; color: #fff; opacity: 0.8;
  font-size: 0.85rem; font-weight: 500; padding: 0.3rem 0;
  transition: opacity 0.2s;
}
.btn-back:hover { opacity: 1 }

/* ============================================================
   LANDING PAGE
   ============================================================ */
.hero {
  background:
    repeating-linear-gradient(135deg, transparent, transparent 80px, rgba(197,150,12,0.03) 80px, rgba(197,150,12,0.03) 82px),
    linear-gradient(180deg, var(--navy) 0%, var(--navy-dark) 100%);
  color: #fff;
  padding: 4.5rem 1.5rem 3.5rem;
  text-align: center;
}
.hero h1 { font-size: 3rem; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 0.4rem }
.hero .gold { color: var(--gold) }
.hero .tagline { font-size: 1.15rem; opacity: 0.85; max-width: 650px; margin: 0 auto 2.5rem; font-weight: 400 }
.stat-strip {
  background: var(--navy-dark);
  display: flex; justify-content: center; flex-wrap: wrap; gap: 2.5rem;
  padding: 1.2rem 1.5rem;
  border-bottom: 3px solid var(--gold);
}
.stat-item { text-align: center }
.stat-num { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; color: var(--gold) }
.stat-label { font-size: 0.72rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 1.5px; color: #fff }

/* Pipeline graphic */
.pipeline-section { max-width: 900px; margin: 3rem auto 0; padding: 0 1.5rem }
.pipeline-section h2 { font-size: 1.5rem; font-weight: 800; text-align: center; color: var(--navy); margin-bottom: 1.5rem }
.pipeline {
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0.4rem;
  margin-bottom: 3rem;
}
.pipe-step {
  background: var(--card); border: 2px solid var(--border); border-radius: var(--radius);
  padding: 0.9rem 1.3rem; text-align: center; min-width: 130px;
  box-shadow: var(--shadow);
  transition: all 0.2s;
}
.pipe-num {
  display: inline-block; background: var(--navy); color: #fff;
  width: 26px; height: 26px; border-radius: 50%;
  font-size: 0.75rem; line-height: 26px; font-weight: 700; margin-bottom: 0.3rem;
}
.pipe-step h4 { font-size: 0.88rem; color: var(--navy); margin-bottom: 0.1rem }
.pipe-step p { font-size: 0.72rem; color: var(--text-muted) }
.pipe-arrow { font-size: 1.3rem; color: var(--gold); font-weight: 900 }

/* Role cards */
.roles-section { max-width: 1000px; margin: 0 auto; padding: 0 1.5rem 4rem }
.roles-section h2 { font-size: 1.5rem; font-weight: 800; text-align: center; color: var(--navy); margin-bottom: 0.4rem }
.roles-section .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem }
.role-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.2rem }
.role-card {
  background: var(--card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 2rem 1.5rem;
  text-align: center;
  border: 2px solid transparent;
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}
.role-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: var(--gold);
  transform: scaleX(0);
  transition: transform 0.3s ease;
}
.role-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--gold) }
.role-card:hover::before { transform: scaleX(1) }
.role-icon { font-size: 2.2rem; margin-bottom: 0.8rem }
.role-card h3 { font-size: 1.15rem; color: var(--navy); margin-bottom: 0.3rem }
.role-card .role-name { font-size: 0.82rem; color: var(--gold); font-weight: 600; margin-bottom: 0.4rem }
.role-card p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5 }

/* ============================================================
   DASHBOARD LAYOUT
   ============================================================ */
.dashboard { max-width: 1200px; margin: 0 auto; padding: 1.5rem }
.dash-header { margin-bottom: 1.5rem }
.dash-header h2 { font-size: 1.6rem; font-weight: 800; color: var(--navy); display: flex; align-items: center; gap: 0.5rem }
.dash-header .dash-sub { color: var(--text-muted); font-size: 0.9rem; margin-top: 0.2rem }

/* Cards */
.card {
  background: var(--card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 1.5rem;
  margin-bottom: 1rem;
}
.card h3 { color: var(--navy); font-size: 1.05rem; margin-bottom: 0.75rem }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; margin-bottom: 1rem }

/* Mini stats */
.mini-stats { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.5rem }
.mini-stat {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 1rem 1.3rem; flex: 1; min-width: 130px; text-align: center;
}
.mini-stat .num { font-family: var(--font-display); font-size: 1.7rem; font-weight: 800 }
.mini-stat .label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 0.15rem }

/* Progress ring */
.progress-ring-wrap { text-align: center; margin-bottom: 1.5rem }
.progress-ring { position: relative; display: inline-block; width: 150px; height: 150px }
.progress-ring svg { transform: rotate(-90deg) }
.progress-ring circle { fill: none; stroke-width: 11 }
.progress-ring .bg-ring { stroke: var(--border) }
.progress-ring .fg-ring { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset 1s ease }
.progress-ring .pct {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  font-family: var(--font-display); font-size: 2rem; font-weight: 800; color: var(--navy);
}
.progress-ring .pct small { display: block; font-size: 0.7rem; font-weight: 400; color: var(--text-muted) }

/* Pipeline steps (horizontal) */
.pipeline-steps { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.5rem }
.p-step {
  flex: 1; min-width: 90px; text-align: center;
  padding: 0.6rem 0.5rem; border-radius: 8px;
  font-size: 0.8rem; font-weight: 600;
  transition: all 0.3s;
}
.p-step.done { background: var(--green-light); color: var(--green) }
.p-step.current { background: var(--gold-pale); color: var(--gold); border: 2px solid var(--gold) }
.p-step.pending { background: #f0f0f0; color: #aaa }

/* ============================================================
   SECTION CARDS (PQS)
   ============================================================ */
.section-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border-left: 4px solid var(--gold);
  margin-bottom: 0.65rem;
  overflow: hidden;
  transition: box-shadow 0.2s;
}
.section-card:hover { box-shadow: var(--shadow-lg) }
.sec-header {
  padding: 0.9rem 1.3rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  user-select: none;
}
.sec-header h4 { font-size: 0.92rem; color: var(--navy) }
.sec-meta { display: flex; align-items: center; gap: 0.75rem; font-size: 0.82rem; color: var(--text-muted) }
.sec-meta .count { font-weight: 600 }
.sec-meta .chevron { transition: transform 0.25s; font-size: 0.7rem }
.section-card.open .chevron { transform: rotate(180deg) }
.sec-body { display: none; border-top: 1px solid var(--border) }
.section-card.open .sec-body { display: block }
.sec-complete .sec-header h4 { color: var(--green) }

/* Section tabs */
.sec-tabs { display: flex; border-bottom: 1px solid var(--border); background: #fafbfc }
.sec-tab {
  padding: 0.55rem 1.2rem; font-size: 0.8rem; font-weight: 600;
  color: var(--text-muted); background: none; border: none;
  border-bottom: 2px solid transparent; transition: all 0.2s;
}
.sec-tab:hover { color: var(--navy) }
.sec-tab.active { color: var(--navy); border-bottom-color: var(--gold) }
.sec-tab-content { display: none; padding: 0.75rem 1.3rem }
.sec-tab-content.active { display: block }

/* Progress bar */
.progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; width: 80px }
.progress-bar .fill { height: 100%; border-radius: 3px; transition: width 0.5s ease }
.fill-green { background: var(--green) }
.fill-gold { background: var(--gold) }
.fill-blue { background: var(--blue) }

/* ============================================================
   TABLES
   ============================================================ */
.data-table { width: 100%; border-collapse: collapse; font-size: 0.84rem }
.data-table th {
  text-align: left; padding: 0.5rem 1rem; background: #f8f9fb;
  color: var(--text-muted); font-weight: 600; font-size: 0.72rem;
  text-transform: uppercase; letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
}
.data-table td { padding: 0.55rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle }
.data-table tr:last-child td { border-bottom: none }
.data-table tr:hover td { background: #f8f9fb }
.td-desc { max-width: 400px }

/* Badges */
.badge {
  display: inline-block; padding: 0.15rem 0.65rem; border-radius: 20px;
  font-size: 0.72rem; font-weight: 600; white-space: nowrap;
}
.badge-signed { background: var(--green-light); color: var(--green) }
.badge-submitted { background: var(--blue-light); color: var(--blue) }
.badge-progress { background: var(--orange-light); color: var(--orange) }
.badge-notstarted { background: #f0f0f0; color: #999 }
.badge-needswork { background: var(--red-light); color: var(--red) }

/* ============================================================
   PORTFOLIO
   ============================================================ */
.portfolio-list { list-style: none }
.portfolio-item {
  padding: 0.65rem 0; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 0.75rem; font-size: 0.9rem;
  cursor: pointer; transition: background 0.15s; padding-left: 0.5rem; padding-right: 0.5rem;
  border-radius: 6px;
}
.portfolio-item:hover { background: #f8f9fb }
.portfolio-item:last-child { border-bottom: none }
.check-icon { font-size: 1.1rem }
.check-on { color: var(--green) }
.check-off { color: #ddd }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-block; padding: 0.45rem 1.1rem; border-radius: 7px;
  font-size: 0.84rem; font-weight: 600; border: none;
  transition: all 0.2s; cursor: pointer; font-family: var(--font-body);
}
.btn-primary { background: var(--navy); color: #fff }
.btn-primary:hover { background: var(--navy-light) }
.btn-gold { background: var(--gold); color: #fff }
.btn-gold:hover { background: #b8860b }
.btn-success { background: var(--green); color: #fff }
.btn-success:hover { background: #15803d }
.btn-danger { background: var(--red); color: #fff }
.btn-danger:hover { background: #b91c1c }
.btn-outline {
  background: transparent; color: var(--navy);
  border: 1.5px solid var(--border);
}
.btn-outline:hover { border-color: var(--navy); background: #f8f9fb }
.btn-sm { padding: 0.3rem 0.8rem; font-size: 0.78rem }

/* ============================================================
   MODAL
   ============================================================ */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,20,40,0.55); backdrop-filter: blur(3px);
  z-index: 200; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex }
.modal {
  background: var(--card); border-radius: var(--radius-lg);
  padding: 2rem; max-width: 540px; width: 92%;
  box-shadow: 0 16px 48px rgba(0,0,0,0.2);
  animation: modalIn 0.25s ease;
  max-height: 85vh; overflow-y: auto;
}
@keyframes modalIn { from { opacity:0; transform: translateY(10px) scale(0.98) } to { opacity:1; transform: none } }
.modal h3 { font-size: 1.15rem; color: var(--navy); margin-bottom: 0.3rem }
.modal .modal-sub { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem }
.modal label { display: block; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 0.25rem; margin-top: 1rem; font-weight: 600 }
.modal input, .modal textarea, .modal select {
  width: 100%; padding: 0.55rem 0.75rem; border: 1.5px solid var(--border);
  border-radius: 7px; font-size: 0.9rem; font-family: var(--font-body);
  transition: border-color 0.2s;
}
.modal input:focus, .modal textarea:focus, .modal select:focus { outline: none; border-color: var(--gold) }
.modal textarea { height: 80px; resize: vertical }
.modal-actions { margin-top: 1.5rem; display: flex; gap: 0.75rem; justify-content: flex-end }
.modal-detail { background: #f8f9fb; border-radius: 8px; padding: 1rem; margin: 0.75rem 0; font-size: 0.88rem }
.modal-detail strong { color: var(--navy); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.5px }

/* ============================================================
   COMMITTEE RUBRIC
   ============================================================ */
.rubric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 1.5rem }
.rubric-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.5rem; text-align: center }
.rubric-card h4 { color: var(--navy); font-size: 0.95rem; margin-bottom: 0.75rem }
.rubric-score { font-family: var(--font-display); font-size: 2.5rem; font-weight: 800; color: var(--gold) }
.rubric-max { font-size: 0.82rem; color: var(--text-muted) }
.score-dots { display: flex; justify-content: center; gap: 0.5rem; margin: 0.75rem 0 }
.dot {
  width: 32px; height: 32px; border-radius: 50%;
  border: 2px solid var(--border); display: inline-flex;
  align-items: center; justify-content: center;
  font-size: 0.75rem; font-weight: 700; cursor: pointer;
  transition: all 0.2s;
}
.dot:hover { border-color: var(--gold); transform: scale(1.1) }
.dot.filled { background: var(--gold); border-color: var(--gold); color: #fff }
.rubric-comments { width: 100%; margin-top: 0.5rem; padding: 0.5rem; border: 1.5px solid var(--border); border-radius: 7px; font-size: 0.85rem; font-family: var(--font-body); height: 60px; resize: vertical }
.rubric-comments:focus { outline: none; border-color: var(--gold) }

/* Decision area */
.decision-area { background: #f8f9fb; border-radius: var(--radius); padding: 1.5rem; margin: 1.5rem 0 }
.decision-area h3 { font-size: 1rem; margin-bottom: 1rem }
.radio-group { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem }
.radio-opt {
  padding: 0.6rem 1.2rem; border: 2px solid var(--border); border-radius: 8px;
  font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
  background: var(--card);
}
.radio-opt:hover { border-color: var(--navy) }
.radio-opt.selected { border-color: var(--gold); background: var(--gold-pale); color: var(--navy) }

/* ============================================================
   ADMIN FUNNEL
   ============================================================ */
.funnel { margin: 1.5rem 0 }
.funnel-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.6rem }
.funnel-label { min-width: 140px; font-size: 0.88rem; font-weight: 600; text-align: right; color: var(--text-muted) }
.funnel-bar {
  height: 34px; border-radius: 6px; display: flex; align-items: center;
  padding: 0 1rem; color: #fff; font-weight: 700; font-size: 0.85rem;
  transition: width 0.8s ease;
}
.funnel-count { margin-left: auto; font-weight: 400; opacity: 0.85; font-size: 0.8rem }

/* Quality cards */
.quality-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem }
.q-card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 1.2rem;
}
.q-card h4 { font-size: 0.9rem; color: var(--navy); margin-bottom: 0.3rem }
.q-card .q-sub { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.5rem }
.q-card .q-stat { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; color: var(--gold) }

/* ============================================================
   FILTER BAR
   ============================================================ */
.filter-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem }
.filter-btn {
  padding: 0.35rem 0.9rem; border-radius: 20px;
  font-size: 0.8rem; font-weight: 600; border: 1.5px solid var(--border);
  background: var(--card); color: var(--text-muted); cursor: pointer;
  transition: all 0.2s;
}
.filter-btn:hover { border-color: var(--navy); color: var(--navy) }
.filter-btn.active { background: var(--navy); color: #fff; border-color: var(--navy) }

/* Fundamentals / Risks lists */
.fund-list, .risk-list { list-style: none; padding: 0 }
.fund-list li, .risk-list li {
  padding: 0.5rem 0; border-bottom: 1px solid var(--border);
  font-size: 0.88rem; display: flex; gap: 0.5rem;
}
.fund-list li:last-child, .risk-list li:last-child { border-bottom: none }
.fund-num { font-weight: 700; color: var(--navy); min-width: 40px; font-size: 0.82rem }
.risk-icon { color: var(--orange); min-width: 20px }

/* ============================================================
   TOAST
   ============================================================ */
#toast-container {
  position: fixed; top: 80px; right: 1.5rem; z-index: 300;
  display: flex; flex-direction: column; gap: 0.5rem;
}
.toast {
  background: var(--card); border-radius: 8px; padding: 0.75rem 1.2rem;
  box-shadow: var(--shadow-lg); font-size: 0.88rem; font-weight: 500;
  transform: translateX(120%); transition: transform 0.3s ease;
  border-left: 4px solid var(--green); max-width: 340px;
}
.toast.show { transform: translateX(0) }
.toast-success { border-left-color: var(--green) }
.toast-info { border-left-color: var(--blue) }
.toast-warning { border-left-color: var(--orange) }

/* ============================================================
   FOOTER
   ============================================================ */
.footer {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
  color: #fff; text-align: center; padding: 2rem 1.5rem; margin-top: 2rem;
}
.footer .footer-brand { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; margin-bottom: 0.3rem }
.footer p { opacity: 0.7; font-size: 0.85rem }

/* ============================================================
   ANIMATIONS
   ============================================================ */
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
.fade-in { animation: fadeIn 0.4s ease forwards }
.stagger-1 { animation-delay: 0.05s; opacity: 0 }
.stagger-2 { animation-delay: 0.1s; opacity: 0 }
.stagger-3 { animation-delay: 0.15s; opacity: 0 }

        else status='in_progress';
      } else if (si === 10) {
        if (ti < 4) { status='signed_off'; const b=new Date('2026-02-03'); b.setDate(b.getDate()+ti*2); date=b.toISOString().split('T')[0]; }
        else if (ti === 4) status='submitted';
        else status='not_started';
      } else if (si === 11) {
        if (ti < 2) { status='signed_off'; const b=new Date('2026-02-17'); b.setDate(b.getDate()+ti*2); date=b.toISOString().split('T')[0]; }
        else if (ti < 4) status='submitted';
        else if (ti === 4) status='in_progress';
        else status='not_started';
      } else if (si === 12) {
        if (ti === 0) { status='signed_off'; date='2026-02-24'; }
        else if (ti === 1) status='submitted';
        else status='not_started';
      }
      state.tasks[task.id] = { status, date, evaluator: status==='signed_off'?'Mike Thompson':null, notes:'' };
    });
  });
  // Portfolio for Sarah
  state.portfolio = {
    qual_record: true, written_cert: true, logbook_transponder: true,
    logbook_pitot: true, form_337: true, transponder_form: false, deviation_card: false
  };
  // Marcus: all tasks signed off, all portfolio done
  state.marcus = { allSigned: true, allPortfolio: true, status: 'oral_ready' };
  // Jake: 32 signed off
  state.jake = { signedOff: 32, total: 75 };
  // Emily: 0
  state.emily = { signedOff: 0, total: 75 };
  return state;
}

/* ============================================================
   STATE MANAGEMENT
   ============================================================ */
const STORAGE_KEY = 'caet_demo_state';
let state;

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) { state = JSON.parse(saved); return; }
  } catch(e) {}
  state = buildDefaultState();
  saveState();
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function resetState() {
  state = buildDefaultState();
  saveState();
  navigate('landing');
  toast('Demo reset to default state', 'info');
}

/* ============================================================
   HELPERS
   ============================================================ */
function getTaskCounts() {
  let signed=0, submitted=0, progress=0, notStarted=0, needsWork=0;
  PQS.forEach(sec => sec.tasks.forEach(t => {
    const s = state.tasks[t.id]?.status || 'not_started';
    if (s==='signed_off') signed++;
    else if (s==='submitted') submitted++;
    else if (s==='in_progress') progress++;
    else if (s==='needs_work') needsWork++;
    else notStarted++;
  }));
  return { signed, submitted, progress, notStarted, needsWork, total: TOTAL_TASKS };
}

function getSectionCounts(sec) {
  let signed=0;
  sec.tasks.forEach(t => { if ((state.tasks[t.id]?.status||'not_started')==='signed_off') signed++; });
  return { signed, total: sec.tasks.length };
}

function getPortfolioCount() {
  return Object.values(state.portfolio).filter(Boolean).length;
}

function statusBadge(status) {
  const map = {
    signed_off: '<span class="badge badge-signed">Signed Off</span>',
    submitted: '<span class="badge badge-submitted">Submitted</span>',
    in_progress: '<span class="badge badge-progress">In Progress</span>',
    not_started: '<span class="badge badge-notstarted">Not Started</span>',
    needs_work: '<span class="badge badge-needswork">Needs Work</span>'
  };
  return map[status] || map.not_started;
}

function progressRingSVG(pct, size=150, stroke=11) {
  const r = (size/2) - stroke;
  const circ = 2 * Math.PI * r;
  const offset = circ - (pct/100) * circ;
  return `<div class="progress-ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}"><circle class="bg-ring" cx="${size/2}" cy="${size/2}" r="${r}"/>
    <circle class="fg-ring" cx="${size/2}" cy="${size/2}" r="${r}" style="stroke-dasharray:${circ};stroke-dashoffset:${offset}"/></svg>
    <div class="pct">${pct}%<small>${Math.round(pct*TOTAL_TASKS/100)} / ${TOTAL_TASKS}</small></div></div>`;
}

function signOffTask(taskId, newStatus) {
  const notes = document.getElementById('signoff-notes')?.value || '';
  state.tasks[taskId] = {
    status: newStatus,
    date: newStatus === 'signed_off' ? new Date().toISOString().split('T')[0] : null,
    evaluator: newStatus === 'signed_off' ? 'Mike Thompson' : null,
    notes: notes
  };
  saveState();
  hideModal();
  toast(newStatus === 'signed_off' ? `Task ${taskId} signed off!` : `Task ${taskId} returned for rework`, newStatus === 'signed_off' ? 'success' : 'warning');
  renderEvaluatorDetail('sarah');
}

function setScore(phase, value) {
  state.oralScores[phase] = value;
  saveState();
  // Update dots
  const container = document.getElementById('dots-'+phase);
  container.querySelectorAll('.dot').forEach((d,i) => {
    d.classList.toggle('filled', i < value);
  });
  document.getElementById('score-'+phase).textContent = value;
}

function selectDecision(decision, el) {
  state.oralResult = decision;
  saveState();
  document.querySelectorAll('#decision-group .radio-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
}

function submitOralBoard() {
  const s = state.oralScores;
  if (!s.portfolio || !s.technical || !s.scenario) { toast('Please score all three phases before submitting', 'warning'); return; }
  if (!state.oralResult) { toast('Please select a final decision', 'warning'); return; }
  saveState();
  toast('Oral board evaluation submitted for Marcus Rodriguez!', 'success');
  setTimeout(() => navigate('committee'), 800);
}

/* ============================================================
   TOAST SYSTEM
   ============================================================ */
function toast(message, type='success') {
  const container = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = message;
  container.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 300);
  }, 3000);
}

/* ============================================================
   MODAL SYSTEM
   ============================================================ */
function hideModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}
